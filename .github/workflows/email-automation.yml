name: TARAS 2K26 Email Automation

on:
  schedule:
    # Explicit 10-minute intervals for reliable GitHub Actions scheduler execution
    - cron: '0,10,20,30,40,50 * * * *'
  repository_dispatch:
    types: [trigger-email-automation, send-emails]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - dry_run
          - test
      test_email:
        description: 'Test recipient email (Required if mode is "test")'
        required: false
        default: ''
        type: string
      daily_limit:
        description: 'Daily Send Cap (Max emails to send in this execution)'
        required: false
        default: '250'
        type: string

# Prevent overlapping runs from racing on the same email_deliveries state.
# A queued run waits for the active run instead of cancelling it.
concurrency:
  group: taras-2k26-email-automation
  cancel-in-progress: false

jobs:
  email-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Email Automation Dependencies
        run: |
          cd automation/email
          npm install

      - name: Execute Email Automation Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
          EMAIL_DAILY_LIMIT: ${{ github.event.inputs.daily_limit || '250' }}
          # Scheduled and repository_dispatch runs are LIVE production runs. Manual runs retain their selected mode.
          EMAIL_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'dry_run' || github.event.inputs.mode == '')) && 'true' || 'false' }}
          EMAIL_TEST_MODE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'test') && 'true' || 'false' }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
        run: |
          cd automation/email
          npx tsx send-emails.ts
